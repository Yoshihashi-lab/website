<head>

  <title>Facility | Yoshihashi Laboratory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
  <style>
    /* 施設紹介ページ用の追加スタイル */
    .facility-overview {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      margin-bottom: 50px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .facility-overview {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    .facility-img-container {
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 10px 30px var(--color-shadow);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .facility-img-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px var(--color-shadow-hover);
    }

    .facility-img-container img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .specs-section {
      background-color: var(--color-white);
      border-radius: var(--radius-lg);
      padding: 40px;
      margin-bottom: 50px;
      box-shadow: 0 2px 10px var(--color-shadow);
      border-top: 4px solid var(--color-accent);
    }

    .beamlines-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .beamlines-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    .beamline-card {
      background-color: var(--color-white);
      border-radius: var(--radius-md);
      padding: 30px;
      box-shadow: 0 2px 8px var(--color-shadow);
      border-left: 5px solid var(--color-primary);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .beamline-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px var(--color-shadow-hover);
    }

    .beamline-card h3 {
      font-size: 1.25rem;
      color: var(--color-primary);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid var(--color-accent-light);
      padding-bottom: 8px;
    }

    .beamline-badge {
      font-size: 0.75rem;
      background-color: var(--color-accent-light);
      color: var(--color-primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
    }

    .beamline-card ul {
      margin-top: 15px;
      list-style-type: disc;
      padding-left: 20px;
    }

    .beamline-card li {
      margin-bottom: 8px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--color-text-mid);
    }

    .beamline-card strong {
      color: var(--color-text);
    }
  </style>
</head>

            <li><a href="blog.html">Blog</a></li>
          </ul>

    <main class="site-main">
      <div class="container" style="text-align: center; padding: 100px 20px; min-height: 50vh; display: flex; align-items: center; justify-content: center;">
